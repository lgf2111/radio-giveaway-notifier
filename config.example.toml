# hotline configuration (example)
#
# Copy this file to `config.toml` and edit it, then run:
#   uv run python -m hotline watch --config config.toml
#
# This file holds NON-SECRET settings only. Secrets (Telegram bot token, chat
# id, and the optional social tokens) are read exclusively from environment
# variables -- see .env.example. Never put secrets in this file.
#
# Offline demo: you do not need a config at all to try hotline. With no
# reachable config, `uv run python -m hotline once --dry-run` reads the bundled
# fixtures/ pages and prints detections.

[source]
# Public 987FM contest / giveaway pages to poll. Always respect the site's
# robots.txt and Terms of Service (hotline checks robots.txt before fetching).
# The 987FM station landing page is server-rendered and robots-allowed.
contest_urls = [
  "https://www.melisten.sg/radio/987",
]

# Sitemap discovery: hotline fetches this sitemap, keeps <loc> entries under
# /radio/987/ whose slug matches giveaway|contest|win|prize|promo, and polls
# those pages. The melisten sitemap is robots-allowed. See the README
# "Target: 987FM" section for the research behind these defaults.
sitemap_url = "https://www.melisten.sg/sitemap.xml"

# Optional public feed (RSS/Atom/JSON) to poll alongside the pages.
# feed_url = "https://example.com/987fm/feed.xml"

# Polite, identifiable User-Agent sent on every HTTP request. Include a way to
# contact you so site owners can reach out instead of simply blocking you.
user_agent = "hotline/0.1 (+https://github.com/lgf2111/radio-giveaway-notifier)"

[poll]
# Seconds between polls in `watch` mode. Keep this reasonable (default 45s) to
# avoid hammering the source. Back off further if you see errors.
interval = 45

[audio]
# The audio source is optional and OFF by default. It pulls the live mp3 stream
# and transcribes 10-second windows locally with faster-whisper (install the
# `audio` extra). Only enable this if you have the right to capture and
# transcribe the stream -- see the LEGAL / ToS / ETHICS section in the README.
#
# WARNING: melisten's robots.txt disallows /api/, /liveradio/, /user/, /login.
# Do NOT point stream_url at https://live.melisten.sg/liveradio/987 -- that path
# is robots-disallowed. Use only a stream you are explicitly permitted to
# capture.
enabled = false
# stream_url = "https://example.com/987fm.mp3"
